
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .chatbot {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 15px 25px;
      background: black;
      color: #00eaff;
      border: 2px solid #00eaff;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    #chatbo {
      display: none;
      position: fixed;
      bottom: 90px;
      right: 30px;
      width: 330px;
      z-index: 1000;
    }

    #cardbody {
      height: 300px;
      overflow-y: auto;
    }

    .bot-msg {
      background: #3c3784;
      color: white;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .user-msg {
      background: #a097a3;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 6px;
      text-align: right;
    }
  </style>
</head>

<body>

<!-- CHAT BUTTON -->
<button class="chatbot" onclick="toggleChat()">CHAT</button>

<!-- CHAT WINDOW -->
<div id="chatbo">
  <div class="card">
    <div class="card-header bg-secondary text-white">
      Chatbot
      <button onclick="toggleChat()" class="btn btn-sm btn-danger float-end">❌</button>
    </div>

    <!-- CHAT MESSAGES -->
    <div class="card-body" id="cardbody">
      <!-- Initial bot message -->
      <div class="bot-msg">
        <b>🤖:</b> Hello! How can I help you?
      </div>
    </div>

    <!-- INPUT -->
    <div class="card-footer">
      <input type="text" id="bes" class="form-control" placeholder="Type message">
      <button class="btn btn-success mt-2 w-100" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
function toggleChat() {
  const chat = document.getElementById("chatbo");
  chat.style.display = chat.style.display === "block" ? "none" : "block";
}

function sendMessage() {
  let input = document.getElementById("bes");
  const chatBody = document.getElementById("cardbody");

  const userMessage = input.value.trim();
  if (!userMessage) return;   // prevent empty messages

  // 1️⃣ Show user message
  chatBody.innerHTML += `
    <div class="user-msg">
      <b>You:</b> ${userMessage}
    </div>
  `;

  // 2️⃣ Clear input & scroll
  input.value = "";
  chatBody.scrollTop = chatBody.scrollHeight;

  // 3️⃣ Send message to backend
  fetch("/calculate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ datas: userMessage })
  })
  .then(res => res.json())
  .then(data => {
    // Show bot reply
    chatBody.innerHTML += `
      <div class="bot-msg">
        <b>🤖:</b> ${data.result}
      </div>
    `;
    chatBody.scrollTop = chatBody.scrollHeight;
  });
}
</script>

</body>
</html>
